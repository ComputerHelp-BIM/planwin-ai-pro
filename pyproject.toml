[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "planwin-ai-pro"
version = "1.0.0"
description = "AI-assisted structural pre-processor, 3-D analysis and IS-code design for RCC buildings (successor to PlanWin/FrameWin)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary – Computer Help" }
authors = [{ name = "Computer Help / Building Software" }]
dependencies = [
  "PySide6>=6.7,<7", "numpy>=1.26", "scipy>=1.11", "ezdxf>=1.1", "openpyxl>=3.1",
  "reportlab>=4.0", "requests>=2.31", "cryptography>=42", "keyring>=24",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.5", "pillow>=10"]

[project.scripts]
planwin-ai = "planwin_ai.cli:main"

[project.gui-scripts]
planwin-ai-pro = "planwin_ai.app:main"

[tool.setuptools.packages.find]
include = ["planwin_ai*"]

[tool.setuptools.package-data]
"planwin_ai.data" = ["*.csv", "*.png", "legacy_samples/*.plw", "templates/*.pwai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
