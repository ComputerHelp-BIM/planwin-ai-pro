[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "planwin-ai-pro"
dynamic = ["version"]  # single source: planwin_ai/__init__.py
description = "AI-assisted structural pre-processor, 3-D analysis and IS-code design for RCC buildings (successor to PlanWin/FrameWin)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary – Computer Help" }
authors = [{ name = "Computer Help / Building Software" }]
dependencies = [
  "PySide6>=6.7,<7", "numpy>=1.26", "scipy>=1.11", "ezdxf>=1.1", "openpyxl>=3.1",
  "reportlab>=4.0", "requests>=2.31", "cryptography>=42", "keyring>=24",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.16", "pyinstaller>=6.5", "pillow>=10"]

[project.scripts]
planwin-ai = "planwin_ai.cli:main"

[project.gui-scripts]
planwin-ai-pro = "planwin_ai.app:main"

[tool.setuptools.dynamic]
version = { attr = "planwin_ai.__version__" }

[tool.setuptools.packages.find]
include = ["planwin_ai*"]

[tool.setuptools.package-data]
"planwin_ai.data" = ["*.csv", "*.png", "legacy_samples/*.plw", "templates/*.pwai"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["packaging/planwin_ai.spec"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade
select = ["E", "W", "F", "I", "B", "UP"]
ignore = [
  "E741",  # engineering symbols such as l, I are idiomatic
  "B905",  # zip() over equal-length engineering arrays; strict= adds noise
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"planwin_ai/gui/theme.py" = ["E501"]  # SVG icon and QSS data

[tool.ruff.format]
quote-style = "double"
